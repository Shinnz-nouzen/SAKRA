<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKRA — ស័ក្រា</title>
<meta name="description" content="SAKRA. An unique Cambodian clothing brand. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,340;0,9..144,440;0,9..144,560;1,9..144,400&family=Archivo:wght@400;500;600&family=Noto+Serif+Khmer:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --black:   #0b0a08;
    --charcoal:#17150f;
    --paper:   #f7f3e9;
    --stone:   #ece5d3;
    --gray:    #8c8674;
    --gray-on-black: #948d78;
    --hair-on-black: rgba(247,243,233,0.16);
    --hair-on-paper: rgba(11,10,8,0.14);
    --ease: cubic-bezier(.22,.61,.19,1);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--black);
    font-family:'Archivo', sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .khmer{ font-family:'Noto Serif Khmer','Fraunces',serif; }

  ::selection{ background:var(--black); color:var(--paper); }

  a{ color:inherit; }

  button, input{ font-family:inherit; }

  /* ---------- focus ---------- */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible{
    outline:1px solid var(--black);
    outline-offset:4px;
  }

  /* =========================================================
     HEADER
  ========================================================= */
  header{
    position:absolute;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding: clamp(20px, 3.4vw, 42px) clamp(20px, 4vw, 56px);
    color:var(--paper);
  }

  .brand-mark{
    display:flex;
    align-items:center;
    gap:12px;
    line-height:1;
  }

  .brand-mark .glyph{
    width:22px;
    height:auto;
    flex-shrink:0;
  }

  .brand-mark .glyph svg{ display:block; width:100%; height:auto; }

  .brand-mark .glyph svg path{ fill:var(--paper); }

  .brand-mark .word{
    font-family:'Fraunces', serif;
    font-weight:440;
    font-size:16px;
    letter-spacing:0.16em;
    text-transform:uppercase;
  }

  .header-note{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gray-on-black);
    text-align:right;
    line-height:1.7;
    padding-top:2px;
  }

  /* =========================================================
     HERO
  ========================================================= */
  .hero{
    position:relative;
    min-height:100svh;
    background:var(--black);
    color:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    padding: 140px 24px 64px;
  }

  .hero::before{
    /* an exceedingly quiet vignette, not a gradient accent */
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 15%, rgba(255,255,255,0.05), transparent 55%);
    pointer-events:none;
  }

  .hero-inner{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:720px;
  }

  .crest{
    width: clamp(220px, 30vw, 400px);
    height:auto;
    opacity:0;
    transform:translateY(14px);
    animation: rise 1.1s var(--ease) 0.15s forwards;
  }

  .crest svg{ display:block; width:100%; height:auto; }

  .hero-khmer{
    margin-top: clamp(26px, 4vw, 40px);
    font-size: clamp(22px, 3vw, 30px);
    font-weight:400;
    letter-spacing:0.01em;
    color:var(--paper);
    opacity:0;
    animation: rise 1s var(--ease) 0.5s forwards;
  }

  .hero-status{
    margin-top:18px;
    font-family:'Archivo', sans-serif;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gray-on-black);
    opacity:0;
    animation: rise 1s var(--ease) 0.68s forwards;
  }

  .hero-rule{
    width:34px;
    height:1px;
    background:var(--hair-on-black);
    margin: 30px 0 30px;
    opacity:0;
    animation: rise 1s var(--ease) 0.82s forwards;
  }

  /* ---- social links ---- */
  .social-links{
    display:flex;
    align-items:center;
    gap:26px;
    opacity:0;
    animation: rise 1s var(--ease) 0.95s forwards;
  }

  .social-links a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:20px;
    height:20px;
    color:var(--paper);
    opacity:0.82;
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }

  .social-links a svg{
    width:100%;
    height:100%;
    fill:currentColor;
    display:block;
  }

  .social-links a:hover{
    opacity:1;
    transform:translateY(-2px);
  }

  .hero-statement{
    position:absolute;
    right: clamp(20px, 4vw, 56px);
    bottom: clamp(22px, 3vw, 40px);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--gray-on-black);
    opacity:0;
    animation: fade 1.2s var(--ease) 1.3s forwards;
  }

  .scroll-cue{
    position:absolute;
    left: clamp(20px, 4vw, 56px);
    bottom: clamp(22px, 3vw, 40px);
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gray-on-black);
    display:flex;
    align-items:center;
    gap:12px;
    opacity:0;
    animation: fade 1.2s var(--ease) 1.3s forwards;
  }

  .scroll-cue .stem{
    width:1px;
    height:26px;
    background:var(--hair-on-black);
    position:relative;
    overflow:hidden;
  }

  .scroll-cue .stem::after{
    content:"";
    position:absolute;
    left:0; top:-100%;
    width:100%; height:100%;
    background:var(--paper);
    animation: stem-run 2.2s ease-in-out 1.8s infinite;
  }

  @keyframes stem-run{
    0%{ top:-100%; }
    50%{ top:100%; }
    100%{ top:100%; }
  }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fade{
    to{ opacity:1; }
  }

  /* =========================================================
     STATEMENT SECTION
  ========================================================= */
  .statement{
    background:var(--paper);
    padding: clamp(96px, 14vw, 168px) clamp(24px, 6vw, 56px);
  }

  .statement-grid{
    max-width:760px;
    margin:0 auto;
  }

  .statement-copy p{
    font-family:'Fraunces', serif;
    font-weight:340;
    font-size: clamp(24px, 3vw, 34px);
    line-height:1.42;
    letter-spacing:0.002em;
    margin:0 0 28px;
    max-width:34ch;
  }

  .statement-copy p:last-child{ margin-bottom:0; }

  .statement-copy em{
    font-style:italic;
    font-weight:400;
  }

  .statement-fine{
    margin-top:44px;
    font-size:13px;
    line-height:1.8;
    color:var(--gray);
    max-width:42ch;
  }

  /* =========================================================
     DETAIL STRIP
  ========================================================= */
  .strip{
    background:var(--stone);
    border-top:1px solid var(--hair-on-paper);
    border-bottom:1px solid var(--hair-on-paper);
  }

  .strip-grid{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .strip-item{
    padding: clamp(34px, 5vw, 52px) clamp(24px, 4vw, 40px);
    border-left:1px solid var(--hair-on-paper);
  }

  .strip-item:first-child{ border-left:none; }

  .strip-item .khmer{
    display:block;
    font-size:15px;
    color:var(--gray);
    margin-bottom:12px;
    font-weight:400;
  }

  .strip-item p{
    margin:0;
    font-size:13px;
    line-height:1.7;
    color:var(--black);
    max-width:26ch;
  }

  /* =========================================================
     FOOTER
  ========================================================= */
  footer{
    background:var(--charcoal);
    color:var(--gray-on-black);
    border-top:1px solid var(--hair-on-black);
    padding: 30px clamp(20px, 4vw, 56px) 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }

  footer .foot-mark{
    display:flex;
    align-items:baseline;
    gap:12px;
  }

  footer .foot-mark .word{
    font-family:'Fraunces', serif;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--paper);
  }

  footer .foot-mark .khmer{
    font-size:12px;
    color:var(--gray-on-black);
  }

  footer .foot-meta{
    font-size:11px;
    letter-spacing:0.04em;
  }

  /* =========================================================
     RESPONSIVE
  ========================================================= */
  @media (max-width: 760px){
    .strip-grid{ grid-template-columns:1fr; }
    .strip-item{ border-left:none; border-top:1px solid var(--hair-on-paper); }
    .strip-item:first-child{ border-top:none; }
    .hero-statement{ position:static; margin-top:40px; }
    .scroll-cue{ display:none; }
    .hero{ padding-top:120px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
    .crest, .hero-khmer, .hero-status, .hero-rule, .social-links, .hero-statement, .scroll-cue{ opacity:1; transform:none; }
  }

</style>
</head>
